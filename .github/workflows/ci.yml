name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type and template check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check links in the built site
        run: npm run test:links
      - name: Check accessibility of the built pages
        run: npm run test:a11y
      - name: Check spaces around inline elements
        run: npm run test:whitespace
